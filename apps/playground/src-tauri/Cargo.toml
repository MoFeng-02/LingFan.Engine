[package]
name = "lingfanengine"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# 多 bin crate（app 主程序 + lfenpack 打包 CLI）：tauri dev 的 `cargo run` 需要显式默认
default-run = "lingfanengine"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lingfanengine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# iOS 原生插件（Swift 包）的编译与链接：build.rs 用 tauri_utils::build::link_apple_library，
# 与 tauri-plugin 的 ios_path() 同一实现（feature 取 build-2 以与 tauri-build 的依赖集一致）
tauri-utils = { version = "2.9.3", features = ["build-2"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.11.1"
keyring = "4.2.0"
base64 = "0.23.1"
getrandom = "0.4.3"
notify = "8.2.0"
sha2 = "0.11.0"
percent-encoding = "2.3.2"
tauri-plugin-fs = "2"

# 移动端 OS 凭据（K1 的 KEK 落点）：keyring 4.x 的 v1 API 只在 macOS/Windows/linux 装配 store，
# iOS 上其 apple 后端还要求 `protected` 特性（否则 apple-native-keyring-store 直接 compile_error 拒绝编译）。
# 这里显式引入该 store 以解锁 iOS 构建；运行期仍需按官方范式 set_default_store
# （`apple_native_keyring_store::protected::Store`）——见 crypto.rs 的移动端装配说明。
[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
