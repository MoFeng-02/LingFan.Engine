<svg xmlns="http://www.w3.org/2000/svg" width="240" height="420" viewBox="0 0 240 420">
  <title>坐在灶台边的小姑娘</title>
  <defs>
    <linearGradient id="dress2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d9ec4"/>
      <stop offset="1" stop-color="#435f80"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a28"/>
      <stop offset="1" stop-color="#332014"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="120" cy="250" rx="120" ry="150" fill="url(#glow)"/>

  <!-- 裙子 -->
  <path d="M96 168 L144 168 L176 340 L64 340 Z" fill="url(#dress2)"/>
  <path d="M96 168 L144 168 L150 206 L90 206 Z" fill="#8fb3d4" opacity="0.75"/>
  <path d="M64 340 L176 340 L180 356 L60 356 Z" fill="#3a5270"/>

  <!-- 手臂 -->
  <path d="M96 176 C78 202 74 232 82 258" stroke="#f0c9a8" stroke-width="15" stroke-linecap="round" fill="none"/>
  <path d="M144 176 C162 202 166 232 158 258" stroke="#f0c9a8" stroke-width="15" stroke-linecap="round" fill="none"/>

  <!-- 脖子 -->
  <rect x="110" y="140" width="20" height="26" rx="8" fill="#f0c9a8"/>

  <!-- 头 -->
  <ellipse cx="120" cy="110" rx="44" ry="48" fill="#f7d8bb"/>

  <!-- 后发 -->
  <path d="M76 108 C72 56 96 34 120 34 C144 34 168 56 164 108 L168 168 L148 150 L92 150 L72 168 Z" fill="url(#hair)"/>

  <!-- 刘海 -->
  <path d="M78 96 C82 56 104 42 120 42 C136 42 158 56 162 96 C150 78 138 70 120 70 C102 70 90 78 78 96 Z" fill="url(#hair)"/>

  <!-- 眼睛 -->
  <ellipse cx="104" cy="112" rx="7" ry="9" fill="#2b1a12"/>
  <ellipse cx="136" cy="112" rx="7" ry="9" fill="#2b1a12"/>
  <circle cx="106.5" cy="108" r="2.4" fill="#ffffff" opacity="0.92"/>
  <circle cx="138.5" cy="108" r="2.4" fill="#ffffff" opacity="0.92"/>

  <!-- 腮红 -->
  <ellipse cx="92" cy="126" rx="9" ry="5.5" fill="#e88f8f" opacity="0.42"/>
  <ellipse cx="148" cy="126" rx="9" ry="5.5" fill="#e88f8f" opacity="0.42"/>

  <!-- 嘴 -->
  <path d="M114 132 Q120 138 126 132" stroke="#b4645c" stroke-width="2.6" stroke-linecap="round" fill="none"/>

  <!-- 发带 -->
  <path d="M78 84 Q120 58 162 84" stroke="#d98f4f" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="162" cy="84" r="6.5" fill="#d98f4f"/>
</svg>
