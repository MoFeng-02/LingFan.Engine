<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="hallWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b4436"/>
      <stop offset="1" stop-color="#2b271f"/>
    </linearGradient>
    <linearGradient id="hallFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a4f35"/>
      <stop offset="1" stop-color="#3c2c1d"/>
    </linearGradient>
    <radialGradient id="hallGlow" cx="0.5" cy="0.12" r="0.72">
      <stop offset="0" stop-color="#ffdca4" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#ffbe6a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffbe6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="doorWay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1520"/>
      <stop offset="1" stop-color="#1d2736"/>
    </linearGradient>
    <linearGradient id="warmDoor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98f4a"/>
      <stop offset="1" stop-color="#8a5c2a"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="500" fill="url(#hallWall)"/>
  <rect y="500" width="1280" height="220" fill="url(#hallFloor)"/>
  <g stroke="#2a1e13" stroke-width="2" opacity="0.45">
    <path d="M0 548H1280M0 608H1280M0 668H1280"/>
    <path d="M300 500V548M700 500V548M1080 500V548M180 548V608M580 548V608M920 548V608M1180 608V668"/>
  </g>
  <rect y="500" width="1280" height="10" fill="#1a130d" opacity="0.6"/>

  <!-- 天花板拱与光 -->
  <ellipse cx="640" cy="120" rx="520" ry="330" fill="url(#hallGlow)"/>
  <path d="M200 500V300a440 440 0 0 1 880 0v200" fill="none" stroke="#5f5541" stroke-width="18"/>
  <path d="M240 500V306a400 400 0 0 1 800 0v194" fill="none" stroke="#7a6e55" stroke-width="8" opacity="0.6"/>

  <!-- 左门：厨房（暖光） -->
  <g>
    <rect x="120" y="196" width="212" height="304" rx="10" fill="#5b4526"/>
    <rect x="136" y="212" width="180" height="288" rx="6" fill="url(#warmDoor)"/>
    <rect x="150" y="230" width="152" height="118" rx="4" fill="#8a5c2a" opacity="0.55"/>
    <rect x="150" y="368" width="152" height="118" rx="4" fill="#8a5c2a" opacity="0.55"/>
    <circle cx="300" cy="356" r="7" fill="#ffe0a0"/>
    <!-- 门缝透光 -->
    <rect x="316" y="212" width="10" height="288" fill="#ffd08a" opacity="0.5"/>
    <path d="M330 500l60-96h46l-24 96Z" fill="#ffcf87" opacity="0.28"/>
  </g>

  <!-- 中门：书房（冷光） -->
  <g>
    <rect x="520" y="176" width="240" height="324" rx="10" fill="#3d3a2c"/>
    <rect x="536" y="192" width="208" height="308" rx="6" fill="url(#doorWay)"/>
    <g stroke="#4a5870" stroke-width="4" opacity="0.5">
      <path d="M536 192l208 308M744 192L536 500"/>
    </g>
    <circle cx="700" cy="356" r="7" fill="#9fb2cc"/>
    <rect x="512" y="176" width="256" height="14" rx="6" fill="#6b6551"/>
  </g>

  <!-- 右门：锁着的门 -->
  <g>
    <rect x="948" y="216" width="212" height="284" rx="10" fill="#3a2f22"/>
    <rect x="964" y="232" width="180" height="268" rx="6" fill="#2b2419"/>
    <g stroke="#5b4a33" stroke-width="3">
      <path d="M964 300h180M964 368h180M964 436h180"/>
    </g>
    <circle cx="1128" cy="360" r="7" fill="#6b5a3f"/>
    <!-- 铁链与锁 -->
    <g stroke="#8d97a1" stroke-width="8" opacity="0.95">
      <path d="M1000 300l124 96M1124 300l-124 96"/>
    </g>
    <rect x="1046" y="366" width="46" height="40" rx="6" fill="#aeb7c0"/>
    <path d="M1058 366v-12a11 11 0 0 1 22 0v12" fill="none" stroke="#aeb7c0" stroke-width="6"/>
    <circle cx="1069" cy="384" r="5" fill="#4a525a"/>
  </g>

  <!-- 吊灯 -->
  <g>
    <path d="M440 0v120M840 0v120" stroke="#2b2118" stroke-width="5"/>
    <path d="M404 120h72l-14 42h-44Z" fill="#c9a15d"/>
    <path d="M804 120h72l-14 42h-44Z" fill="#c9a15d"/>
    <ellipse cx="440" cy="162" rx="20" ry="7" fill="#ffe6b0"/>
    <ellipse cx="840" cy="162" rx="20" ry="7" fill="#ffe6b0"/>
  </g>

  <!-- 边桌与花瓶 -->
  <g>
    <rect x="392" y="392" width="96" height="12" rx="4" fill="#6b5136"/>
    <rect x="404" y="404" width="10" height="96" fill="#543f28"/>
    <rect x="466" y="404" width="10" height="96" fill="#543f28"/>
    <path d="M420 392v-40h40v40Z" fill="#7d6a8f" opacity="0.9"/>
    <path d="M440 352c-16-18 6-30-4-48M440 352c18-20-4-30 6-46" stroke="#6b7a4a" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 地毯 -->
  <g opacity="0.9">
    <path d="M360 660h560l60 60H300Z" fill="#7b3f3f"/>
    <path d="M404 668h472l40 44H364Z" fill="none" stroke="#d8b37c" stroke-width="4"/>
  </g>

  <rect width="1280" height="720" fill="none" stroke="#0d1116" stroke-width="60" opacity="0.35"/>
</svg>
