# 发布公开包到 npm：@lingfan-engine/{core,adapters,ui,shell,editor,stories-build}
#
# 触发方式只有一种：推送形如 `v0.1.2` 的标签。标签既是版本号的载体，也是发布的开关——
# 不推标签就不会有版本上线，因此「发了什么」与「git 里有个什么标签」永远对得上。
# 手工触发只用于演练：`dry_run` 为真时打包、自检、跑门禁，但不碰 registry。
#
# 认证走 Trusted Publishing（OIDC）：GitHub Actions 用工作流身份换取 registry 的短期凭据，
# 仓库里不存任何长期 token，也不需要浏览器里的二次验证码。
#
# 为什么不是 `pnpm publish`：这些包的依赖写的是 workspace 协议，只有 pnpm 在打包阶段
# 会把它改写成具体版本范围。而发布动作要交给 npm（registry 的 OIDC 与 provenance 都
# 以 npm CLI 为准）。所以流程拆成两步——`pnpm pack` 产出已改写的 tarball，`npm publish`
# 发布该 tarball。直接 `npm publish <包目录>` 会把 workspace 协议原样发出去，消费方装不上。
#
# 启用前提（一次性，在 npmjs.com 上做）：六个包各自在设置里添加 Trusted Publisher，
# 指向本仓库与本文件名，并勾选允许发布。未配置时发布步骤会因无权限失败，门禁与自检仍然照跑。

name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只打包与检查，不真正发布
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: pnpm 与 Node
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 版本一致性排在四道门禁之前：标签指向的版本与包内版本不符时，
      # 后面全部跑通也没有意义——那样发出去的东西名不副实。
      - name: 版本一致性
        run: node scripts/version-check.mjs

      - name: 类型检查
        run: pnpm typecheck

      - name: 代码风格
        run: pnpm lint

      - name: 单元测试
        run: pnpm test:unit

      - name: 运行时可达图审计
        run: pnpm audit:runtime

  publish:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: pnpm 与 Node
        uses: pnpm/action-setup@v4
        with:
          version: 12

      # 不设 `registry-url`：setup-node 会往 ~/.npmrc 写一行指向 `${NODE_AUTH_TOKEN}` 的
      # 认证条目，而这里没有长期 token，那行就成了字面量占位符，被当作无效凭据发出去，
      # 反而盖住了 Trusted Publishing 的换证路径。不设它，npm 默认就打官方 registry。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # npm CLI 自带版本偏旧，Trusted Publishing 需要较新的 CLI 才能完成 OIDC 换证
      - name: 升级 npm CLI
        run: npm install -g npm@latest

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 标签与包内版本必须一致：这一步同时负责把版本号交给后续步骤与 Release 正文。
      # 不显式传 `--tag`：脚本自己按 `GITHUB_REF` 判断本次是不是标签触发。手工触发时
      # `GITHUB_REF` 指向分支，推不出标签，于是只做包间对账——演练因此不会被分支名卡住。
      # 版本用单引号：双引号里反引号会被 bash 当命令替换，`\`` 与 `\${...}` 都救不回来。
      - name: 版本一致性
        id: version
        run: |
          set -euo pipefail
          node scripts/version-check.mjs
          node -e 'console.log("version=" + require("./package.json").version)' >> "$GITHUB_OUTPUT"

      # 打包与校验是同一步：`--keep` 让脚本把 tarball 留在 dist-npm，随后发布的就是这一批。
      # 分开做会出现「检查的是 A、发出去的是 B」。
      - name: 打包并自检
        run: node scripts/publish-check.mjs --keep dist-npm

      - name: 发布
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          # 发布前先打印身份与认证来源：OIDC 换证失败时，这一行能区分「没换到证」与
          # 「换到证但包被拒」，两种原因的修法完全不同。
          npm --version
          echo "npmrc 认证条目：$(grep -c _authToken "$HOME/.npmrc" 2>/dev/null || echo 0)"
          # 逐个上传同一批 tarball。任何一个失败都中止，避免出现「一半新一半旧」的版本组合。
          # 路径必须带 `./`：npm 会把两段式的 `dist-npm/x.tgz` 认成 `github:dist-npm/x.tgz`。
          for tgz in dist-npm/*.tgz; do
            echo "发布 $tgz"
            npm publish "./$tgz" --access public --provenance
          done

  release:
    needs: publish
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 发布说明从提交历史聚合，按仓库既有的提交信息格式分节：标题形如
      # `类型(范围): 摘要`，正文分「新增 / 优化 / 修复 / 其他变更」。
      # 这样发布说明与提交记录同源，不需要人再手写一遍。
      - name: 生成发布说明
        id: notes
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs --version "${{ needs.publish.outputs.version }}" > notes.md
          cat notes.md
          {
            echo "body<<RELEASE_NOTES_EOF"
            cat notes.md
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.publish.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          # 预发布版本号（含 `-rc.1` 之类后缀）自动标为预发布，正式版不标
          prerelease: ${{ contains(needs.publish.outputs.version, '-') }}
          generate_release_notes: false
