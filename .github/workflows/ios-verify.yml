# iOS 构建与冒烟验证（macOS runner）
#
# 为什么需要它：iOS 只能在 macOS + Xcode 上编译，本机是 Windows——本工作流是 iOS 侧
# 唯一的编译/运行验证途径（Swift 插件、Rust ios 分支、Info.plist 声明、端到端冒烟）。
#
# 三条关键约束（实测/社区一致，勿随意改动）：
# 1. 必须用 `cargo tauri`（cargo-binstall 安装的 tauri-cli）——`ios init` 生成的 Xcode 工程
#    会把 `cargo tauri ios xcode-script` 烘进构建阶段；用 npm 版 CLI 初始化会写入无法解析的调用。
# 2. `xcodegen` 不在 runner 镜像内，需 brew 安装（cocoapods 自带）。
# 3. 模拟器目标（aarch64-sim）免签名；真机/导出 IPA 才需要 Apple 证书——本工作流只做前者。
#
# 触发：手动（Actions → Run workflow）或推送触及移动端/引擎源码时。

name: iOS Verify

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/playground/src-tauri/**"
      - "apps/playground/src/**"
      - "packages/**"
      - ".github/workflows/ios-verify.yml"

concurrency:
  group: ios-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CI: "true"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Rust 工具链（含 iOS 模拟器目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/playground/src-tauri

      - name: pnpm 与 Node
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 JS 依赖
        run: pnpm install --frozen-lockfile

      # tauri ios init 会自检 Apple 依赖（xcodegen / libimobiledevice / cocoapods），缺了它会自己
      # 调 `brew reinstall`——而那次调用处在 Rosetta(x86_64) 上下文，brew 会拒绝装进 ARM 前缀
      # （/opt/homebrew）而失败。这里先用 `arch -arm64` 装好，让自检直接通过、不再触发它自己装。
      - name: 安装 iOS 工程工具（含 tauri 自检的 Apple 依赖）
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          arch -arm64 brew install xcodegen libimobiledevice || brew install xcodegen libimobiledevice
          arch -arm64 brew list --versions xcodegen libimobiledevice || true
          pod --version || true

      - name: 安装 Tauri CLI（必须是 cargo 子命令形态）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      # 注意：crate 名是 `tauri-cli`（二进制才是 cargo-tauri）——按 cargo-tauri 查会找不到 crate。
      # 带 GITHUB_TOKEN 让 binstall 直接命中 release 预编译资产；无 token 时限流会回退源码编译（实测约 11 分钟）。
      - name: 安装 tauri-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall tauri-cli --version "^2" --no-confirm

      # 本机（Windows）无法编译 target_os = "ios" 的分支——这一步是 ⑨-7 唯一的 Rust 侧编译验证
      # 失败时把错误塞进 check-run annotation：无凭据环境下 Workflow 日志不可下载，annotation 可匿名读
      - name: Rust iOS 目标编译检查
        working-directory: apps/playground/src-tauri
        run: |
          set +e
          cargo check --target aarch64-apple-ios --lib > /tmp/ios-check.log 2>&1
          status=$?
          tail -40 /tmp/ios-check.log
          if [ "$status" -ne 0 ]; then
            body=$(tail -30 /tmp/ios-check.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=iOS Rust check 失败::$body"
          fi
          exit "$status"

      - name: 初始化 iOS 工程
        working-directory: apps/playground
        run: cargo tauri ios init --ci

      # Swift 插件源在 src-tauri/ios/（Swift 包），由 build.rs 经 link_apple_library 于 cargo
      # 构建期编译并链接——**不需要**复制进 gen/apple 或重跑 xcodegen（Rust 先于 app Swift 链接，
      # 放 Xcode 工程 Sources 反而会 Undefined symbol _init_plugin_shell）。

      - name: 诊断环境与工程架构设置（排错用；以 notice annotation 回传，匿名可读）
        working-directory: apps/playground/src-tauri
        run: |
          set +e
          {
            echo "uname=$(uname -m) proc_translated=$(sysctl -n sysctl.proc_translated 2>/dev/null || echo n/a)"
            echo "sw_vers=$(sw_vers -productVersion 2>/dev/null) xcodebuild=$(xcodebuild -version 2>/dev/null | head -1)"
            echo "brew=$(brew --prefix 2>/dev/null) pod=$(command -v pod) xcodegen=$(command -v xcodegen)"
            echo "cargo-tauri=$(command -v cargo-tauri) $(file -b "$(command -v cargo-tauri)" 2>/dev/null | cut -c1-70)"
            echo "rustc_host=$(rustc -vV | sed -n 's/^host: //p')"
            echo "--- gen/apple/project.yml 架构相关 ---"
            grep -nE "ARCHS|EXCLUDED_ARCHS|ONLY_ACTIVE_ARCH|deploymentTarget|iOS:" gen/apple/project.yml 2>/dev/null | head -12
          } > /tmp/ios-diag.log 2>&1
          cat /tmp/ios-diag.log
          body=$(sed -e 's/\x1b\[[0-9;]*m//g' /tmp/ios-diag.log | awk '{printf "%s%%0A", $0}')
          echo "::notice title=iOS 环境诊断::$body"

      - name: 构建 iOS 模拟器 app（debug，免签名）
        working-directory: apps/playground
        run: |
          set +e
          cargo tauri ios build --debug --target aarch64-sim > /tmp/ios-build.log 2>&1
          status=$?
          # 去 ANSI + 只留诊断行（<200 字符）：命令回显里含 -Werror 会污染 "error" 过滤
          sed -e 's/\x1b\[[0-9;]*m//g' /tmp/ios-build.log | tail -60
          if [ "$status" -ne 0 ]; then
            body=$(sed -e 's/\x1b\[[0-9;]*m//g' /tmp/ios-build.log \
              | awk 'length($0) < 200 && (/error:|Undefined symbols|BUILD FAILED|fatal error|reason: |The following build commands failed/)' \
              | tail -14 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            [ -n "$body" ] || body="（未提取到诊断行，见 step 输出末尾）"
            echo "::error title=iOS 构建失败::$body"
          fi
          exit "$status"

      - name: 列出构建产物（定位排错用）
        working-directory: apps/playground/src-tauri
        run: find gen/apple/build -maxdepth 4 -name "*.app" -o -maxdepth 4 -name "*.a" 2>/dev/null | head -20 || true

      - name: 上传 .app 产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          if-no-files-found: error
          path: apps/playground/src-tauri/gen/apple/build/**/*.app

      - name: 模拟器冒烟（安装 → 启动 → 截图）
        working-directory: apps/playground/src-tauri
        run: |
          set -euo pipefail
          app=$(find gen/apple/build -maxdepth 3 -name "*.app" -type d | head -1)
          test -n "$app"
          echo "APP=$app"

          # 取第一个可用 iPhone 模拟器（device 行形如 `    iPhone 15 (UDID) (Shutdown)`）
          udid=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          test -n "$udid"
          echo "SIM_UDID=$udid"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

          xcrun simctl install "$udid" "$app"
          # 启动并抓取进程控制台；失败即判失败（App 崩溃/无法启动）
          xcrun simctl launch --console-pty "$udid" com.langfeng.lingfanengine > /tmp/ios-launch.log 2>&1 &
          sleep 25

          # 进程存活检查：启动 25s 后仍能查到进程（未崩溃）
          if ! xcrun simctl spawn "$udid" launchctl list | grep -qi "com.langfeng.lingfanengine"; then
            echo "::error::iOS 冒烟失败——App 启动后未存活（见 launch 日志）"
            cat /tmp/ios-launch.log || true
            exit 1
          fi

          xcrun simctl io "$udid" screenshot /tmp/ios-smoke.png
          # 证据清单输出（判读归人工/视觉：截图应显示工程内容而非「工程加载失败」）
          echo "=== 冒烟证据 ==="
          ls -la /tmp/ios-smoke.png
          echo "=== App 控制台（末尾 40 行）==="
          tail -40 /tmp/ios-launch.log || true

      - name: 上传冒烟证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-evidence
          if-no-files-found: warn
          path: |
            /tmp/ios-smoke.png
            /tmp/ios-launch.log
