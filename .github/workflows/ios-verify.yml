# iOS 构建与冒烟验证（macOS runner）
#
# 为什么需要它：iOS 只能在 macOS + Xcode 上编译，本机是 Windows——本工作流是 iOS 侧
# 唯一的编译/运行验证途径（Swift 插件、Rust ios 分支、Info.plist 声明、端到端冒烟）。
#
# 三条关键约束（实测/社区一致，勿随意改动）：
# 1. 必须用 `cargo tauri`（cargo-binstall 安装的 tauri-cli）——`ios init` 生成的 Xcode 工程
#    会把 `cargo tauri ios xcode-script` 烘进构建阶段；用 npm 版 CLI 初始化会写入无法解析的调用。
# 2. `xcodegen` 不在 runner 镜像内，需 brew 安装（cocoapods 自带）。
# 3. 模拟器目标（aarch64-sim）免签名；真机/导出 IPA 才需要 Apple 证书——本工作流只做前者。
#
# 触发：手动（Actions → Run workflow）或推送触及移动端/引擎源码时。

name: iOS Verify

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/playground/src-tauri/**"
      - "apps/playground/src/**"
      - "packages/**"
      - ".github/workflows/ios-verify.yml"

concurrency:
  group: ios-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CI: "true"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Rust 工具链（含 iOS 模拟器目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          # project.yml 固定 ARCHS=[arm64, x86_64]：模拟器两个切片都要有对应 Rust 静态库
          targets: aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-ios

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/playground/src-tauri

      - name: pnpm 与 Node
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 JS 依赖
        run: pnpm install --frozen-lockfile

      # tauri ios init 会自检 Apple 依赖（xcodegen / libimobiledevice / cocoapods），缺了它会自己
      # 调 `brew reinstall`——而那次调用处在 Rosetta(x86_64) 上下文，brew 会拒绝装进 ARM 前缀
      # （/opt/homebrew）而失败。这里先用 `arch -arm64` 装好，让自检直接通过、不再触发它自己装。
      # 必须先构建前端：Tauri 在编译期把 `frontendDist` 嵌进 Rust 静态库；若先跑 cargo check
      # （本步之后）再构建前端，产物里嵌的是空/旧资源 → 应用启动后白屏（无任何 JS 可执行）
      - name: 预构建前端（供 Rust 编译期嵌入）
        working-directory: apps/playground
        run: |
          set -euo pipefail
          pnpm build --mode tauri
          test -f dist/index.html || { echo "::error::dist/index.html 缺失"; exit 1; }
          ls -la dist | head -10

      - name: 安装 iOS 工程工具（含 tauri 自检的 Apple 依赖）
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          arch -arm64 brew install xcodegen libimobiledevice || brew install xcodegen libimobiledevice
          arch -arm64 brew list --versions xcodegen libimobiledevice || true
          pod --version || true

      - name: 安装 Tauri CLI（必须是 cargo 子命令形态）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      # 注意：crate 名是 `tauri-cli`（二进制才是 cargo-tauri）——按 cargo-tauri 查会找不到 crate。
      # 带 GITHUB_TOKEN 让 binstall 直接命中 release 预编译资产；无 token 时限流会回退源码编译（实测约 11 分钟）。
      - name: 安装 tauri-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 必须显式指定 aarch64 资产：默认可能取到 x86_64-apple-darwin，其派生的 brew 调用会被
          # Homebrew 判定为 Rosetta 而拒绝安装（runner 实为 arm64）
          cargo binstall tauri-cli --version "^2" --target aarch64-apple-darwin --no-confirm
          file -b "$(command -v cargo-tauri)" | grep -q arm64 || { echo "::error::cargo-tauri 不是 arm64 二进制：$(file -b "$(command -v cargo-tauri)")"; exit 1; }

      # 本机（Windows）无法编译 target_os = "ios" 的分支——这一步是 ⑨-7 唯一的 Rust 侧编译验证
      # 失败时把错误塞进 check-run annotation：无凭据环境下 Workflow 日志不可下载，annotation 可匿名读
      - name: Rust iOS 目标编译检查
        working-directory: apps/playground/src-tauri
        run: |
          set +e
          cargo check --target aarch64-apple-ios --lib > /tmp/ios-check.log 2>&1
          status=$?
          tail -40 /tmp/ios-check.log
          if [ "$status" -ne 0 ]; then
            body=$(tail -30 /tmp/ios-check.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=iOS Rust check 失败::$body"
          fi
          exit "$status"

      - name: 初始化 iOS 工程
        working-directory: apps/playground
        run: cargo tauri ios init --ci

      # Swift 插件源在 src-tauri/ios/（Swift 包），由 build.rs 经 link_apple_library 于 cargo
      # 构建期编译并链接——**不需要**复制进 gen/apple 或重跑 xcodegen（Rust 先于 app Swift 链接，
      # 放 Xcode 工程 Sources 反而会 Undefined symbol _init_plugin_shell）。

      - name: 诊断环境与工程架构设置（排错用；以 notice annotation 回传，匿名可读）
        working-directory: apps/playground/src-tauri
        run: |
          set +e
          {
            echo "uname=$(uname -m) proc_translated=$(sysctl -n sysctl.proc_translated 2>/dev/null || echo n/a)"
            echo "sw_vers=$(sw_vers -productVersion 2>/dev/null) xcodebuild=$(xcodebuild -version 2>/dev/null | head -1)"
            echo "brew=$(brew --prefix 2>/dev/null) pod=$(command -v pod) xcodegen=$(command -v xcodegen)"
            echo "cargo-tauri=$(command -v cargo-tauri) $(file -b "$(command -v cargo-tauri)" 2>/dev/null | cut -c1-70)"
            echo "rustc_host=$(rustc -vV | sed -n 's/^host: //p')"
            echo "--- gen/apple/project.yml 架构相关 ---"
            grep -nE "ARCHS|EXCLUDED_ARCHS|ONLY_ACTIVE_ARCH|deploymentTarget|iOS:" gen/apple/project.yml 2>/dev/null | head -12
          } > /tmp/ios-diag.log 2>&1
          cat /tmp/ios-diag.log
          body=$(sed -e 's/\x1b\[[0-9;]*m//g' /tmp/ios-diag.log | awk '{printf "%s%%0A", $0}')
          echo "::notice title=iOS 环境诊断::$body"

      - name: 构建 iOS 模拟器 app（debug，免签名）
        working-directory: apps/playground
        run: |
          set +e
          cargo tauri ios build --debug --target aarch64-sim x86_64 > /tmp/ios-build.log 2>&1
          status=$?
          # 去 ANSI + 只留诊断行（<200 字符）：命令回显里含 -Werror 会污染 "error" 过滤
          sed -e 's/\x1b\[[0-9;]*m//g' /tmp/ios-build.log | tail -60
          if [ "$status" -ne 0 ]; then
            body=$(sed -e 's/\x1b\[[0-9;]*m//g' /tmp/ios-build.log \
              | awk 'length($0) < 800 && (/error:|Undefined symbols|BUILD FAILED|fatal error|reason: |The following build commands failed|library not found|could not find/)' \
              | tail -12 | cut -c1-400 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            [ -n "$body" ] || body="（未提取到诊断行，见 step 输出末尾）"
            echo "::error title=iOS 构建失败::$body"
          fi
          exit "$status"

      - name: 产物结构自述（白屏类问题验尸用；notice annotation 匿名可读）
        working-directory: apps/playground/src-tauri
        run: |
          set +e
          app=$(find gen/apple/build -maxdepth 3 -name "*.app" -type d | head -1)
          {
            echo "APP=$app"
            echo "--- 顶层 ---"
            ls -1 "$app" 2>/dev/null | head -30
            echo "--- index.html / js / assets（证明前端是否打进去）---"
            find "$app" -maxdepth 4 \( -name "index.html" -o -name "*.js" -o -name "assets" -o -name "dist" \) 2>/dev/null | sed "s|$app|<app>|" | head -20
            echo "--- 资源目录 ---"
            find "$app" -maxdepth 3 -type d \( -name "Resources" -o -name "_up_" \) 2>/dev/null | sed "s|$app|<app>|" | head -10
          } > /tmp/ios-app-structure.txt 2>&1
          cat /tmp/ios-app-structure.txt
          echo "::notice title=iOS 产物结构::$(awk '{printf "%s%%0A", $0}' /tmp/ios-app-structure.txt | cut -c1-6000)"

      - name: 列出构建产物（定位排错用）
        working-directory: apps/playground/src-tauri
        run: find gen/apple/build -maxdepth 4 -name "*.app" -o -maxdepth 4 -name "*.a" 2>/dev/null | head -20 || true

      - name: 上传 .app 产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          if-no-files-found: error
          path: apps/playground/src-tauri/gen/apple/build/**/*.app

      - name: 模拟器冒烟（安装 → 启动 → 截图 → 先取证再断言）
        working-directory: apps/playground/src-tauri
        run: |
          set +e
          app=$(find gen/apple/build -maxdepth 3 -name "*.app" -type d | head -1)
          test -n "$app" || { echo "::error::未找到 .app"; exit 1; }
          echo "APP=$app"

          # 取第一个可用 iPhone 模拟器（device 行形如 `    iPhone 15 (UDID) (Shutdown)`）
          udid=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          test -n "$udid" || { echo "::error::无可用模拟器"; exit 1; }
          echo "SIM_UDID=$udid"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

          xcrun simctl install "$udid" "$app" || { echo "::error::安装失败"; exit 1; }
          # 启动并抓取进程控制台（--console-pty 收 stdout/stderr，含 Rust panic）
          # SIMCTL_CHILD_ 前缀把环境变量注入被测 App → 打开 DOM/媒体诊断探针（Rust 侧 eval，默认零行为）
          SIMCTL_CHILD_LFEN_IOS_DIAG=1 xcrun simctl launch --console-pty "$udid" com.langfeng.lingfanengine > /tmp/ios-launch.log 2>&1 &
          sleep 30

          # 存活检查带重试（simctl launch 与进程注册偶有竞态；实测同代码有 1 次误判）
          alive=no
          for _ in 1 2 3; do
            xcrun simctl spawn "$udid" launchctl list 2>/dev/null | grep -qi "com.langfeng.lingfanengine" && { alive=yes; break; }
            sleep 5
          done
          xcrun simctl io "$udid" screenshot /tmp/ios-smoke.png 2>/dev/null || true
          # 启动期系统日志（WebKit 资源加载错误 / 崩溃 / Rust stderr 都在这里）
          xcrun simctl spawn "$udid" log show --last 2m --style compact \
            --predicate 'process == "lingfanengine" OR eventMessage CONTAINS "lingfanengine"' \
            > /tmp/ios-oslog.txt 2>&1 || true

          # **先取证再断言**：无论存活与否都把诊断回传（否则崩溃日志会随失败一起丢掉）
          {
            echo "alive=$alive shot=$(ls -la /tmp/ios-smoke.png 2>/dev/null | awk '{print $5}')"
            echo "--- launch 控制台（末尾 40 行）---"
            tail -40 /tmp/ios-launch.log 2>/dev/null
            echo "--- lfen 标记（Rust 命令 / Swift 插件视图树）---"
            grep -a "lfen" /tmp/ios-oslog.txt 2>/dev/null | tail -15
            echo "--- os_log 过滤（崩溃/断言/WebKit/error；末 20 行）---"
            grep -aiE "fatal|crash|uncaught|assert|exception|panic|failed to load|WebKit|error" /tmp/ios-oslog.txt 2>/dev/null | tail -20
          } > /tmp/ios-smoke-diag.txt
          cat /tmp/ios-smoke-diag.txt
          echo "::notice title=iOS 冒烟诊断::$(awk '{printf "%s%%0A", $0}' /tmp/ios-smoke-diag.txt | cut -c1-6000)"

          [ "$alive" = yes ] || { echo "::error::App 启动后未存活（诊断见上方 notice）"; exit 1; }

      - name: 上传冒烟证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-evidence
          if-no-files-found: warn
          path: |
            /tmp/ios-smoke.png
            /tmp/ios-launch.log
