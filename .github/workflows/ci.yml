# 提交门禁：版本一致性、类型检查、代码风格、单元测试、运行时可达图检查
#
# 判据与本地 `pnpm <script>` 同源，不接受 CI 专属变体：本地绿了这里才可能绿，
# 反之这里红了就是本地漏跑——不需要在两处维护两套标准。
#
# 不跑任何打包命令：产物构建属于发布流程（release.yml）与人工，门禁只管静态正确性。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的新提交直接取代旧运行：门禁只关心最新一次是否绿
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: pnpm 与 Node
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 版本一致性排在四道门禁之前：七个包是一套配套件，版本错开就会产生
      # 「适配器要 core 新号、实际装到旧号」这类无解组合，而任何单包都不会因此报错。
      - name: 版本一致性
        run: node scripts/version-check.mjs

      - name: 类型检查
        run: pnpm typecheck

      - name: 代码风格
        run: pnpm lint

      - name: 单元测试
        run: pnpm test:unit

      - name: 运行时可达图检查
        run: pnpm audit:runtime

  # 包管理器矩阵：脚手架产物在四家包管理器下都要装得起来、编译得过、打得出包。
  #
  # 产物链（生成器 → 模板 → 依赖安装 → 故事编译 → 打包）与包管理器强相关：
  # 安装脚本的白名单机制、锁文件的写法、脚本命令的透传，各家都不一样。
  # 只在产物层验（不碰仓内源码），因此装的是 registry 上已发布的包——
  # 这条作业是长期护栏，不覆盖仓内尚未发布的改动。
  package-manager-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, pnpm, yarn, bun]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 准备包管理器
        run: |
          corepack enable
          npm install -g bun
          # npm 的安装脚本默认走白名单，不放行则 esbuild 的平台二进制装不上，
          # 产物在 npm 这一格会编译失败。其它三家不认这个键，设了也无副作用。
          echo "npm_config_allow_scripts=esbuild" >> "$GITHUB_ENV"

      - name: 打出脚手架包
        run: |
          mkdir -p "$RUNNER_TEMP/tgz"
          npm pack ./packages/create --pack-destination "$RUNNER_TEMP/tgz"

      - name: 装上脚手架
        run: npm install -g "$RUNNER_TEMP/tgz"/lingfan-engine-create-*.tgz

      - name: 生成示例工程
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          cd "$RUNNER_TEMP/work"
          lingfan-create demo --yes --dir .

      - name: 安装依赖
        working-directory: ${{ runner.temp }}/work/demo
        run: ${{ matrix.manager }} install

      # 生成器按依赖区间装的是 registry 上**已发布**的引擎包，所以这一步是在验
      # 「已发布版本能不能撑起当前模板」——仓内源码有新 API 但没发版时，这里会红。
      # 仓内五门用的是源码路径，抓不到这一类。必须在打包之前跑：vite 只转译不检查。
      - name: 类型检查
        working-directory: ${{ runner.temp }}/work/demo
        run: ${{ matrix.manager }} run typecheck

      - name: 编译故事
        working-directory: ${{ runner.temp }}/work/demo
        run: ${{ matrix.manager }} run stories:build

      - name: 打包
        working-directory: ${{ runner.temp }}/work/demo
        run: ${{ matrix.manager }} run build

  # 框架形态的叠加层（Vue / React）改的是入口文件与页面结构，仓内 typecheck 的
  # include 只覆盖骨架 `__PROJECT__/src`，叠加层那份入口根本不在程序里——
  # 骨架自带 `src/main.ts`，叠加层另加 `src/main.tsx` 时 tsc 只收前者，
  # 被 `index.html` 真正加载的那个文件从来没被检查过。这里按形态真生成再查。
  # 按形态真生成再验：`--framework` / `--shell` 各自会引入一层叠加层源码，
  # 而叠加层被根 tsconfig 的 exclude 挡住、不在仓内 typecheck 覆盖面内。
  # 矩阵按「框架」与「壳」两组取值展开，同一个生成流程跑遍全部组合。
  framework-forms:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # 框架层：换掉组合根与页面结构
          - framework: vue
            shell: browser
            entry: src/main.ts
          - framework: react
            shell: browser
            entry: src/main.tsx
          # 壳层：小程序换掉整个页面与组件树，桌面壳只补 src-tauri
          - framework: none
            shell: miniprogram
            entry: src/main.ts
          - framework: none
            shell: tauri
            entry: src/main.ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 打出脚手架包
        run: |
          mkdir -p "$RUNNER_TEMP/tgz"
          npm pack ./packages/create --pack-destination "$RUNNER_TEMP/tgz"

      - name: 装上脚手架
        run: npm install -g "$RUNNER_TEMP/tgz"/lingfan-engine-create-*.tgz

      - name: 生成 ${{ matrix.framework }} / ${{ matrix.shell }} 形态工程
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          cd "$RUNNER_TEMP/work"
          lingfan-create demo --yes --framework ${{ matrix.framework }} --shell ${{ matrix.shell }} --dir .
          echo "npm_config_allow_scripts=esbuild" >> "$GITHUB_ENV"

      - name: 安装依赖
        working-directory: ${{ runner.temp }}/work/demo
        run: npm install

      # 两条都验：入口是否被真正纳入程序（`--listFiles` 里有没有它），
      # 以及类型是否自洽。只跑 tsc 不够——被遮蔽时它一声不响地绿。
      - name: 入口文件必须在程序的类型检查范围内
        working-directory: ${{ runner.temp }}/work/demo
        run: |
          entry="${{ matrix.entry }}"
          npx tsc --noEmit --listFilesOnly | grep -qF "/$entry" || {
            echo "::error::$entry 没有被纳入类型检查——它很可能被同目录同名的另一个入口遮蔽了"
            exit 1
          }

      - name: 类型检查
        working-directory: ${{ runner.temp }}/work/demo
        run: npm run typecheck
