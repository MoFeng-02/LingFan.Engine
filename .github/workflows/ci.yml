# 提交门禁：版本一致性、类型检查、代码风格、单元测试、运行时可达图检查
#
# 判据与本地 `pnpm <script>` 同源，不接受 CI 专属变体：本地绿了这里才可能绿，
# 反之这里红了就是本地漏跑——不需要在两处维护两套标准。
#
# 不跑任何打包命令：产物构建属于发布流程（release.yml）与人工，门禁只管静态正确性。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的新提交直接取代旧运行：门禁只关心最新一次是否绿
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: pnpm 与 Node
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 版本一致性排在四道门禁之前：七个包是一套配套件，版本错开就会产生
      # 「适配器要 core 新号、实际装到旧号」这类无解组合，而任何单包都不会因此报错。
      - name: 版本一致性
        run: node scripts/version-check.mjs

      - name: 类型检查
        run: pnpm typecheck

      - name: 代码风格
        run: pnpm lint

      - name: 单元测试
        run: pnpm test:unit

      - name: 运行时可达图检查
        run: pnpm audit:runtime

  # 包管理器矩阵：脚手架产物在四家包管理器下都要装得起来、编译得过、打得出包。
  #
  # 产物链（生成器 → 模板 → 依赖安装 → 故事编译 → 打包）与包管理器强相关：
  # 安装脚本的白名单机制、锁文件的写法、脚本命令的透传，各家都不一样。
  # 只在产物层验（不碰仓内源码），因此装的是 registry 上已发布的包——
  # 这条作业是长期护栏，不覆盖仓内尚未发布的改动。
  package-manager-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, pnpm, yarn, bun]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 准备包管理器
        run: |
          corepack enable
          npm install -g bun
          # npm 的安装脚本默认走白名单，不放行则 esbuild 的平台二进制装不上，
          # 产物在 npm 这一格会编译失败。其它三家不认这个键，设了也无副作用。
          echo "npm_config_allow_scripts=esbuild" >> "$GITHUB_ENV"

      - name: 打出脚手架包
        run: |
          mkdir -p "$RUNNER_TEMP/tgz"
          npm pack ./packages/create --pack-destination "$RUNNER_TEMP/tgz"

      - name: 装上脚手架
        run: npm install -g "$RUNNER_TEMP/tgz"/lingfan-engine-create-*.tgz

      - name: 生成示例工程
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          cd "$RUNNER_TEMP/work"
          lingfan-create demo --yes --dir .

      - name: 安装依赖
        working-directory: ${{ runner.temp }}/work/demo
        run: ${{ matrix.manager }} install

      - name: 编译故事
        working-directory: ${{ runner.temp }}/work/demo
        run: ${{ matrix.manager }} run stories:build

      - name: 打包
        working-directory: ${{ runner.temp }}/work/demo
        run: ${{ matrix.manager }} run build
