<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__PROJECT__</title>
    <!-- 页面外观与层样式：与「页面结构」分开，框架叠加层可复用同一份样式表 -->
    <link rel="stylesheet" href="/src/styles/stage.css" />
  </head>

  <body>
    <!-- 舞台视口：铺满窗口、只读尺寸与收拢点击。它的三个子层各住一个坐标系：
         舞台根按设计基准缩放，震动层跟着舞台一起抖，UI 层按窗口像素排布。
         各层 z 由 main.ts 按 shell.layers 写入。 -->
    <div id="stage-viewport">
      <!-- 舞台根：宽高与变换由适配装配写入（设计基准 × 缩放策略），这里不写死 -->
      <div id="stage-root">
        <!-- 震动层：屏幕震动只改这一层的位移，缩放留在父层，两层互不覆盖。
             挂载层也住这里——组件坐标由作者按设计基准摆放，必须随舞台一起缩与抖。 -->
        <div id="stage-shake">
          <div id="stage"></div>
          <div id="mounts"></div>
        </div>
      </div>
      <!-- 宿主 UI 层：按窗口像素排布，不随舞台缩放（否则小窗口下字会小到看不清） -->
      <div id="shell-ui">
        <div id="nvl"></div>
        <div id="dialogue">
          <div id="speaker"></div>
          <div id="text">加载中……</div>
          <div id="hint"></div>
        </div>
        <div id="choices"></div>
        <div id="notifications"></div>
        <div id="toolbar">
          <span>存档</span>
          <select id="slot"></select>
          <button id="save">存</button>
          <button id="load">读</button>
        </div>
        <!-- 历史面板槽位：可选节点（缺了游戏照跑，只是回看已走过的对话要另想办法） -->
        <div id="history"></div>
        <!-- 偏好面板槽位：可选节点（缺了游戏照跑，只是没有音量/字速面板） -->
        <div id="prefs"></div>
        <div id="error"></div>
      </div>
      <!-- 转场遮罩：盖住整屏（含舞台与 UI 层），故与两个层平级而不是住在 UI 层里 -->
      <div id="transition"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
