<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__PROJECT__</title>
    <!-- 页面外观与层样式：与「页面结构」分开，框架叠加层可复用同一份样式表 -->
    <link rel="stylesheet" href="/src/styles/stage.css" />
  </head>

  <body>
    <!-- 舞台根：屏幕震动（shake）施于此；各层 z 由 main.ts 按 shell.layers 写入 -->
    <div id="stage-root">
      <div id="stage"></div>
      <div id="nvl"></div>
      <div id="dialogue">
        <div id="speaker"></div>
        <div id="text">加载中……</div>
        <div id="hint"></div>
      </div>
      <div id="choices"></div>
      <div id="notifications"></div>
      <div id="toolbar">
        <span>存档</span>
        <select id="slot"></select>
        <button id="save">存</button>
        <button id="load">读</button>
      </div>
      <!-- 偏好面板槽位：可选节点（缺了游戏照跑，只是没有音量/字速面板） -->
      <div id="prefs"></div>
      <!-- UI 挂载层：`mount` 命令显示/隐藏的组件挂在这里（可选节点，缺了只是没有 UI）。
           位置在对话与工具条之后、转场遮罩之前：UI 盖住对话层，但盖不住转场与错误条。 -->
      <div id="mounts"></div>
      <div id="transition"></div>
      <div id="error"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
