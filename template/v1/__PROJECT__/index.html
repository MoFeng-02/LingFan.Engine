<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__PROJECT__</title>
    <!-- 页面外观与层样式：与「页面结构」分开，框架叠加层可复用同一份样式表 -->
    <link rel="stylesheet" href="/src/styles/stage.css" />
  </head>

  <body>
    <!-- 舞台根：屏幕震动（shake）施于此；各层 z 由 main.ts 按 shell.layers 写入 -->
    <div id="stage-root">
      <div id="stage"></div>
      <div id="nvl"></div>
      <div id="dialogue">
        <div id="speaker"></div>
        <div id="text">加载中……</div>
        <div id="hint"></div>
      </div>
      <div id="choices"></div>
      <div id="notifications"></div>
      <div id="toolbar">
        <span>存档</span>
        <select id="slot"></select>
        <button id="save">存</button>
        <button id="load">读</button>
      </div>
      <!-- 偏好面板槽位：可选节点（缺了游戏照跑，只是没有音量/字速面板） -->
      <div id="prefs"></div>
      <!-- 页面容器：可选节点（整屏界面由宿主按列 id 挂到这里；不给就是所有列都按 op 渲染） -->
      <div id="page"></div>
      <div id="transition"></div>
      <div id="error"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
